name: Auto Tag on Version Bump

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version bump and create tag
        run: |
          set -e
          VER=$(node -p "require('./package.json').version")
          TAG="v$VER"
          # skip if tag already exists on remote
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists — skip"
            exit 0
          fi
          # also skip if current commit already tagged with this version
          if git describe --exact-match --tags HEAD 2>/dev/null | grep -q "$TAG"; then
            echo "HEAD already at $TAG"
            exit 0
          fi
          echo "Creating tag $TAG on $GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Pushed $TAG"
